[package]
name = "rs-jq"
version = "0.1.0"
edition = "2024"

[lib]
name = "rs_jq"
path = "src/lib.rs"
# cdylib: Python extension (feature `python`); rlib: Rust CLI / tests
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rjq"
path = "src/bin/jq/main.rs"
required-features = ["cli"]

[[test]]
name = "suite_e2e"
path = "tests/suite_e2e.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:structopt"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.3", optional = true }
structopt = { version = "0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
